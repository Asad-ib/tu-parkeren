<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0A1628">
  <title>TU Delft Parkeren</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --tu-blue: #00A6D6;
      --ok:   #2ECC8A;
      --warn: #F5A623;
      --full: #E8314A;
      --bg:    #0A1628;
      --card:  #0E2247;
      --card2: #152D5A;
      --text:  #E8F0FE;
      --muted: #7A9BC0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 24px;
    }

    header {
      background: var(--card);
      padding: 20px 20px 16px;
      border-bottom: 2px solid var(--tu-blue);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo { font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--tu-blue); text-transform: uppercase; }
    h1    { font-size: 20px; font-weight: 700; margin-top: 6px; line-height: 1.2; }
    .ts   { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .refresh-btn {
      background: var(--tu-blue);
      border: none;
      border-radius: 50%;
      width: 42px; height: 42px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity .2s;
    }
    .refresh-btn:active { opacity: .7; }
    .refresh-btn.spinning { animation: spin .8s linear infinite; }
    .refresh-btn svg { width: 20px; height: 20px; fill: white; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- summary ---- */
    .summary {
      background: var(--card2);
      margin: 16px 16px 0;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .summary-num   { font-size: 30px; font-weight: 800; color: var(--tu-blue); line-height: 1; }
    .summary-label { font-size: 13px; color: var(--muted); line-height: 1.4; }
    .summary-label strong { display: block; color: var(--text); font-size: 15px; }

    /* ---- grid ---- */
    .grid {
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      text-decoration: none;
      color: inherit;
      border: 1.5px solid transparent;
      transition: transform .1s;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .card:active { transform: scale(.97); }
    .card.ok   { border-color: var(--ok); }
    .card.warn { border-color: var(--warn); }
    .card.full { border-color: var(--full); }

    .card-accent { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .ok   .card-accent { background: var(--ok); }
    .warn .card-accent { background: var(--warn); }
    .full .card-accent { background: var(--full); }

    .card-badge {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: var(--card2);
      color: var(--tu-blue);
      font-size: 13px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }

    .card-num { font-size: 34px; font-weight: 800; line-height: 1; }
    .ok   .card-num { color: var(--ok); }
    .warn .card-num { color: var(--warn); }
    .full .card-num { color: var(--full); }

    .bar-wrap  { background: var(--card2); border-radius: 4px; height: 5px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 4px; transition: width .6s ease; }
    .ok   .bar-fill { background: var(--ok); }
    .warn .bar-fill { background: var(--warn); }
    .full .bar-fill { background: var(--full); }

    .card-addr { font-size: 11px; color: var(--muted); line-height: 1.4; }

    .card-status { font-size: 12px; font-weight: 600; margin-top: auto; }
    .ok   .card-status { color: var(--ok); }
    .warn .card-status { color: var(--warn); }
    .full .card-status { color: var(--full); }

    /* skeletons */
    .skeleton { background: var(--card); border-radius: 14px; height: 140px; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: .8; } }

    .error {
      margin: 16px;
      padding: 14px;
      background: rgba(232,49,74,.15);
      border: 1px solid var(--full);
      border-radius: 10px;
      font-size: 13px;
      color: #F79DAA;
      text-align: center;
      line-height: 1.6;
    }
    .error a { color: var(--tu-blue); }

    /* bottom nav */
    .nav {
      display: flex; gap: 10px;
      padding: 0 16px 16px;
    }
    .nav a {
      flex: 1;
      background: var(--card);
      border-radius: 10px;
      padding: 12px 8px;
      color: var(--muted);
      font-size: 12px; font-weight: 600;
      text-decoration: none;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .nav a:active { background: var(--card2); color: var(--tu-blue); }
    .nav svg { width: 16px; height: 16px; }
  </style>
</head>
<body>

<header>
  <div class="header-row">
    <div>
      <div class="logo">TU Delft Campus</div>
      <h1>Parkeerplekken</h1>
      <div class="ts" id="ts">Laden…</div>
    </div>
    <button class="refresh-btn" id="btn" onclick="load()" aria-label="Vernieuwen">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </div>
</header>

<div id="root"></div>

<div class="nav">
  <a href="https://www.tudelftcampus.nl/nl/bereikbaarheid" target="_blank">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
    Campus site
  </a>
  <a href="https://www.tudelftcampus.nl/nl/map?types=parking-spot" target="_blank">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
    Plattegrond
  </a>
</div>

<script>
const WORKER_URL = 'https://tu-parking.asadbutt2007.workers.dev/';

const LOTS = [
  { id:'P1', addr:'Van der Waalsweg',      total:500, nav:'https://www.google.com/maps/dir//Van+der+Waalsweg,+2628+CN+Delft' },
  { id:'P2', addr:'Van den Broekweg',      total:850, nav:'https://www.google.com/maps/dir//Van+Den+Broekweg,+2628+CN+Delft' },
  { id:'P3', addr:'Van der Maasweg 11',    total:350, nav:'https://www.google.com/maps/dir//Parkeerplaats,+Van+der+Maasweg+11,+2628+CN+Delft' },
  { id:'P4', addr:'Kluyverweg 1',          total:350, nav:'https://www.google.com/maps/dir//Kluyverweg+1,+2629+HS+Delft' },
  { id:'P5', addr:'Cornelis Drebbelweg 1', total:200, nav:'https://www.google.com/maps/dir//TU+Delft+Parking+P5,+Cornelis+Drebbelweg+1,+2628+CM+Delft' },
  { id:'P6', addr:'Zuidplantsoen',         total:200, nav:'https://www.google.com/maps/dir//Zuidplantsoen,+2628+CN+Delft' },
];

function cls(n) {
  if (n === 0)  return { c:'full', w:'Vol' };
  if (n < 30)   return { c:'warn', w:'Bijna vol' };
  return { c:'ok', w:'Beschikbaar' };
}

function showSkeleton() {
  document.getElementById('root').innerHTML =
    '<div class="grid">' + Array(6).fill('<div class="skeleton"></div>').join('') + '</div>';
}

async function load() {
  const btn = document.getElementById('btn');
  btn.classList.add('spinning');
  document.getElementById('ts').textContent = 'Laden…';
  showSkeleton();

  try {
    const res = await fetch(WORKER_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Status ${res.status}`);
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    render(json.parking);
  } catch(e) {
    document.getElementById('root').innerHTML =
      `<div class="error">
        ❌ Ophalen mislukt: ${e.message}<br><br>
        Open de <a href="https://www.tudelftcampus.nl/nl/bereikbaarheid" target="_blank">campus website</a> als alternatief.
      </div>`;
    document.getElementById('ts').textContent = 'Mislukt';
  } finally {
    btn.classList.remove('spinning');
  }
}

function render(data) {
  const now = new Date().toLocaleTimeString('nl-NL', { hour:'2-digit', minute:'2-digit' });
  document.getElementById('ts').textContent = `Bijgewerkt om ${now}`;

  const total = Object.values(data).reduce((a,b) => a+b, 0);

  let cards = '';
  LOTS.forEach(l => {
    const n = (l.id in data) ? data[l.id] : '?';
    const s = typeof n === 'number' ? cls(n) : { c:'warn', w:'?' };
    const pct = typeof n === 'number' ? Math.min(100, Math.round(n / l.total * 100)) : 0;

    cards += `
      <a class="card ${s.c}" href="${l.nav}" target="_blank" rel="noopener">
        <div class="card-accent"></div>
        <div class="card-badge">${l.id}</div>
        <div class="card-num">${n}</div>
        <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="card-addr">${l.addr}</div>
        <div class="card-status">${s.w}</div>
      </a>`;
  });

  document.getElementById('root').innerHTML = `
    <div class="summary">
      <div class="summary-num">${total}</div>
      <div class="summary-label">
        <strong>Totaal vrij</strong>
        op alle 6 locaties
      </div>
    </div>
    <div class="grid">${cards}</div>`;
}

// Start
load();
setInterval(load, 2 * 60 * 1000);
</script>
</body>
</html>
